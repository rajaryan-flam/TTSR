# Precision mode for TTSR video inference (test_video.py).
#
# exact  fp32 everywhere. Bit-for-bit identical to the original, unoptimized
#        script. Model inference: ~3.5 FPS (measured on the ananya test clip,
#        RTX PRO 6000 Blackwell). Use this if you need guaranteed-exact output.
#
# tf32   Enables TF32 for the SearchTransfer correlation matmul (cuDNN's own
#        convs already default to TF32 -- this just closes the same gap for
#        matmul). ~15% faster than exact. Pixel impact is tiny: max 9/255
#        diff, only ~1.8% of pixels touched at all, imperceptible in a video.
#        Recommended default.
#
# fast   tf32, plus runs MainNet (the upsampling network, ~55% of per-frame
#        cost) in fp16 autocast. ~62% faster than exact (the biggest lever
#        available without changing the algorithm). fp16 measured closer to
#        fp32 than bf16 here at identical speed (this checkpoint's MainNet
#        activations peak around ~9 in magnitude, well within fp16's range,
#        so bf16's extra exponent bits buy nothing and just cost mantissa
#        precision). Pixel impact vs exact: max ~2-9/255 diff on most frames.
#        Should look fine visually, but eyeball the output before trusting it
#        for anything that needs to match "exact" closely.
precision: fast
